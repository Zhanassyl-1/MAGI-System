name: MAGI CI Pipeline

on:
  push:
    branches:
      - main
      - 'frontend/**'
      - 'backend/**'
      - 'qa/**'
      - 'management/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-infrastructure:
    name: Verify Infrastructure & Task Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python Scripts Syntax
        run: |
          python3 -m py_compile scripts/magi.py
          python3 -m py_compile scripts/agent_onboard.py
          python3 -m py_compile scripts/validate_pr.py

      - name: Test Task CLI Status
        run: |
          python3 scripts/magi.py status
          python3 scripts/magi.py list

      - name: Validate Agent Onboarding Protocol
        run: |
          python3 scripts/agent_onboard.py --agent FE-1
          python3 scripts/agent_onboard.py --agent BE-1
          python3 scripts/agent_onboard.py --agent QA-1
          python3 scripts/agent_onboard.py --agent PM

  test-frontend:
    name: Frontend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Check Frontend Tests (if present)
        run: |
          if [ -f "package.json" ]; then
            npm ci
            npm test -- --passWithNoTests
          else
            echo "No package.json detected yet. Skipping frontend test execution until project initialization."
          fi

  test-backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Backend Tests (if present)
        run: |
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            pip install pytest
            pytest -q
          else
            echo "No backend dependency manifest detected yet. Skipping backend test execution until project initialization."
          fi
